<div class="modal-overlay" v-if="isOpen" @click.self="handleCancel" @keydown.esc="handleCancel" tabindex="-1">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title" v-text="modalTitle"></span>
      <button class="btn-icon" @click="handleCancel" title="Tutup" aria-label="Tutup modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Pesan konfirmasi jika ada -->
      <p v-if="modalMessage" v-text="modalMessage" style="font-size: 14.5px; line-height: 1.6;"></p>
      <!-- Slot untuk konten kustom formulir/lainnya -->
      <slot></slot>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" @click="handleCancel" v-text="cancelLabel"></button>
      <button
        v-if="showConfirmBtn"
        :class="['btn', confirmButtonClass]"
        @click="handleConfirm"
        v-text="confirmLabel"
      ></button>
    </div>
  </div>
</div>
