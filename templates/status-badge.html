<div class="status-cell-wrap" @mouseenter="showTooltip = true" @mouseleave="showTooltip = false">
  <!-- Badge Status -->
  <span :class="['badge', badgeClass]">
    <!-- Ikon Aman (Check) -->
    <svg v-if="badgeType === 'aman'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <!-- Ikon Menipis (Warning) -->
    <svg v-else-if="badgeType === 'menipis'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <!-- Ikon Kosong (Alert/Cross) -->
    <svg v-else-if="badgeType === 'kosong'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
    <!-- Ikon Status Lain (Muted) -->
    <svg v-else width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="6"/>
    </svg>
    <!-- Label Status -->
    <span v-text="badgeLabel"></span>
  </span>

  <!-- Tooltip Preview Catatan HTML saat Mouse Hover (Soal Hal 4) -->
  <div class="status-tooltip" v-if="catatan && showTooltip">
    <div style="font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; margin-bottom: 3px;">
      Catatan Bahan Ajar:
    </div>
    <div v-html="catatan"></div>
  </div>
</div>
